<!DOCTYPE html><html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connessione Wi-Fi</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
    }

    .card {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        text-align: center;
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .wifi-icon {
        font-size: 58px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 28px;
    }

    .description {
        margin: 0 0 25px;
        color: #666;
        font-size: 16px;
        line-height: 1.5;
    }

    .network {
        margin-bottom: 25px;
        padding: 15px;
        background: #f2f2f7;
        border-radius: 14px;
    }

    .network-label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        color: #777;
    }

    .network-name {
        font-size: 18px;
        font-weight: 600;
    }

    .connect-button {
        display: block;
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: #007aff;
        color: white;
        font-size: 17px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
    }

    .connect-button:active {
        opacity: 0.7;
    }

    .note {
        margin-top: 20px;
        font-size: 13px;
        line-height: 1.5;
        color: #777;
    }
</style>

</head><body><main class="card">

    <div class="wifi-icon">📶</div>

    <h1>Connetti al Wi-Fi</h1>

    <p class="description">
        Premi il pulsante qui sotto per configurare la connessione alla rete Wi-Fi.
    </p>

    <div class="network">
        <span class="network-label">Rete disponibile</span>
        <span class="network-name">Vodafone-C43124283</span>
    </div>

    <a class="connect-button" href="wifi.mobileconfig">
        Connetti al Wi-Fi
    </a>

    <p class="note">
        Dopo aver premuto il pulsante, l'iPhone potrebbe chiederti
        di confermare l'installazione della configurazione Wi-Fi.
    </p>

</main>

</body>
</html>
